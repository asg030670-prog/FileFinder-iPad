name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests-linux:
    name: Core unit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  ios-build:
    name: Unit tests (macOS) and iPad app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run core unit tests
        run: swift test
      - name: Build package for iOS
        run: >
          xcodebuild build
          -scheme FileFinder-Package
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      - name: Build iPad app
        run: >
          xcodebuild build
          -project App/FileFinder.xcodeproj
          -scheme FileFinder
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
